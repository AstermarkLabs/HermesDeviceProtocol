[project]
name = "hdp-reference-node"
version = "0.0.0"
description = "Python HDP reference node"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiohttp",
  "hdp-proto",
]

[project.scripts]
hdp-node = "hdp_reference_node.cli:main"

[tool.uv.sources]
hdp-proto = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hdp_reference_node"]

