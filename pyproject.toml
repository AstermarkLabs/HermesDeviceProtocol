[project]
name = "hermes-device-protocol"
version = "0.0.0"
description = "Hermes Device Expansion MVP workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "hdp-proto",
  "hermes-device-plugin",
  "hdp-bridge",
  "hdp-reference-node",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "ruff",
]

[tool.uv.workspace]
members = [
  "hdp-spec",
  "hermes-device-plugin",
  "hdp-bridge",
  "hdp-reference-node",
]

[tool.uv.sources]
hdp-proto = { workspace = true }
hermes-device-plugin = { workspace = true }
hdp-bridge = { workspace = true }
hdp-reference-node = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is the point of a test file, not a hazard to flag.
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["hdp-spec/hdp_proto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
markers = [
  "acceptance: requires the prepared real-Hermes runner and a live model provider",
]
testpaths = [
  "tests",
  "hdp-spec/tests",
  "hermes-device-plugin/tests",
  "hdp-bridge/tests",
  "hdp-reference-node/tests",
]
