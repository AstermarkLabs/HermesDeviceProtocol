name: CI

# M0 Day-3 deliverable (docs/m0-plan.md D4): runs the quality gate (`make check`) on the Python
# 3.11 matrix required by NFR-8. M4 adds the acceptance job to this existing workflow rather than
# inventing a new one.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync

      - name: make check (ruff check, ruff format --check, mypy, pytest)
        run: make check
