[project]
name = "oracle"
version = "0.0.0"
description = "Hermes Device Expansion MVP workspace"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "ruff",
]

[tool.uv.workspace]
members = [
  "hdp-spec",
  "hermes-device-plugin",
  "hdp-bridge",
  "hdp-reference-node",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.mypy]
python_version = "3.11"
files = ["hdp-spec/hdp_proto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = [
  "tests",
  "hermes-device-plugin/tests",
  "hdp-bridge/tests",
  "hdp-reference-node/tests",
]

