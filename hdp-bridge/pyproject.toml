[project]
name = "hdp-bridge"
version = "0.0.0"
description = "HDP daemon and control plane"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiohttp",
  "hdp-proto",
  "pyyaml",
]

[project.scripts]
hdp-bridge = "hdp_bridge.cli:main"

[tool.uv.sources]
hdp-proto = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hdp_bridge"]
