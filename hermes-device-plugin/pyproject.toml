[project]
name = "hermes-device-plugin"
version = "0.0.0"
description = "Hermes plugin for HDP device capabilities"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiohttp",
  "hdp-proto",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
hdp-proto = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["hermes_device_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"hermes_device_plugin/plugin.yaml" = "hermes_device_plugin/plugin.yaml"

